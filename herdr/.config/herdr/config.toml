# ~/.config/herdr/config.toml
#
# Keybindings are stock herdr defaults — there is deliberately no [keys]
# section. prefix = ctrl+b; LazyVim's leader stays <space>. Press prefix+?
# for the live keymap, or `herdr --default-config` for every setting.
#
# Note: `copy_mode` exists as an action but ships unbound in 0.7.1.
# To enable tmux-style copy mode, add:
#   [keys]
#   copy_mode = "prefix+["

onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
mouse_capture = true
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
