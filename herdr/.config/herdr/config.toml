# ~/.config/herdr/config.toml
#
# Keybindings mostly use stock herdr defaults. prefix = ctrl+b;
# LazyVim's leader stays <space>. Press prefix+? for the live keymap,
# or `herdr --default-config` for every setting.
#
# Note: `copy_mode` exists as an action but ships unbound in 0.7.1.
# To enable tmux-style copy mode, add:
#   [keys]
#   copy_mode = "prefix+["

onboarding = false

[theme]
name = "catppuccin"

[keys]
previous_workspace = "prefix+shift+j"
next_workspace = "prefix+shift+k"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

# Optional: bind current-branch creation separately.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

# Optional: include remote-tracking branches for this picker.
[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "Worktree: switch / create from local or remote branches"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"

[ui.toast]
delivery = "herdr"

[ui]
status_indicators = "symbols"
