# Complete ~/.config/herdr/config.toml.
# Herdr owns Cmd-X; LazyVim owns Cmd-Shift-X. Applications keep native local keymaps otherwise.

onboarding = false

[theme]
name = "catppuccin"
auto_switch = false
[keys]
prefix = "cmd+x"

help = "prefix+?"
settings = "prefix+s"
workspace_picker = "prefix+w"
goto = "prefix+g"

navigate_workspace_down = "j"
navigate_workspace_up = "k"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"

navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"

split_vertical = "prefix+v"
split_horizontal = "prefix+h"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+z"
copy_mode = "prefix+y"
edit_scrollback = "prefix+e"

new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
close_tab = "prefix+shift+x"
rename_pane = "prefix+r"
rename_tab = "prefix+shift+r"

new_workspace = "prefix+shift+c"
close_workspace = "prefix+ctrl+shift+x"
rename_workspace = "prefix+ctrl+shift+r"

detach = "prefix+d"
reload_config = "prefix+ctrl+r"

[ui]
mouse_capture = true
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
