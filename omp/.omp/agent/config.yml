symbolPreset: nerd
setupVersion: 1

theme:
  dark: dark-catppuccin

statusLine:
  preset: nerd
  separator: none
  transparent: true

modelRoles:
  default: "@large"
  small: openai-codex/gpt-5.6-sol:medium
  medium: openai-codex/gpt-5.6-sol:high
  large: anthropic/claude-opus-5:high
  xlarge: anthropic/claude-opus-5:max
  budget: openai-codex/gpt-5.6-luna:xhigh

defaultThinkingLevel: auto
hideThinkingBlock: false
proseOnlyThinking: true
omitThinking: false

retry:
  maxRetries: 3
  modelFallback: true
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-sol:xhigh
    small:
      - anthropic/claude-opus-5:low
    medium:
      - anthropic/claude-opus-5:medium
    large:
      - openai-codex/gpt-5.6-sol:xhigh
    xlarge:
      - openai-codex/gpt-5.6-sol:max
    budget:
      - anthropic/claude-opus-5:low

advisor:
  enabled: true

tools:
  approvalMode: yolo

stt:
  enabled: false

readLineNumbers: true
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true

vault:
  enabled: false
checkpoint:
  enabled: true
task:
  agentModelOverrides: {}

cycleOrder:
  - budget
  - small
  - medium
  - default
  - xlarge
